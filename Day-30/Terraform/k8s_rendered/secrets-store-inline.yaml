apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: medishift-kv-secrets
  namespace: medishift-dev
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    useWorkloadIdentity: "true" # Enables Azure Workload Identity integration
    keyvaultName: "kv-medishift-dev-4rnxt7" # Replace with Key Vault Name output from Terraform
    tenantId: "ffdb5413-63c8-40ec-a158-c5ad34880e3d" # Replace with Tenant ID output from Terraform
    clientID: "ae9000ac-56a9-4e71-93d8-b5cd81a8ea4f" # Replace with Workload Identity client ID output
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: jwt-secret
          objectType: secret
        - |
          objectName: postgres-user
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: postgres-db
          objectType: secret
  secretObjects:
    - secretName: medishift-secrets
      type: Opaque
      data:
        - key: DATABASE_URL
          objectName: database-url
        - key: JWT_SECRET
          objectName: jwt-secret
        - key: POSTGRES_USER
          objectName: postgres-user
        - key: POSTGRES_PASSWORD
          objectName: postgres-password
        - key: POSTGRES_DB
          objectName: postgres-db
