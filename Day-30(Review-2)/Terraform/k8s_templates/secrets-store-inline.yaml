apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: medishift-kv-secrets
  namespace: medishift-${environment}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    useWorkloadIdentity: "true" # Enables Azure Workload Identity integration
    keyvaultName: "${keyvault_name}" # Replace with Key Vault Name output from Terraform
    tenantId: "${tenant_id}" # Replace with Tenant ID output from Terraform
    clientID: "${workload_client_id}" # Replace with Workload Identity client ID output
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: jwt-secret
          objectType: secret
        - |
          objectName: postgres-user
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: postgres-db
          objectType: secret
  secretObjects:
    - secretName: medishift-secrets
      type: Opaque
      data:
        - key: DATABASE_URL
          objectName: database-url
        - key: JWT_SECRET
          objectName: jwt-secret
        - key: POSTGRES_USER
          objectName: postgres-user
        - key: POSTGRES_PASSWORD
          objectName: postgres-password
        - key: POSTGRES_DB
          objectName: postgres-db
